name: offline-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall src scripts

      - name: Lint
        run: python -m ruff check src scripts tests

      - name: Test
        run: python -m pytest -q

      - name: Validate documentation
        run: python scripts/validate_documentation.py

      - name: Validate corpus
        run: python scripts/validate_corpus_v2_1.py

      - name: Validate Final v2
        run: python scripts/validate_final_v2.py

      - name: Validate project completion
        run: python scripts/validate_project_complete.py

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check CLI help and dry run
        run: |
          python -m rag_foundations.cli --help
          python -m rag_foundations.cli ask --help
          python scripts/run_final_v2.py --dry-run

      - name: Reject public fake evidence modes
        shell: bash
        run: |
          check_rejects_fake() {
            set +e
            stderr="$(python "$@" 2>&1 >/tmp/fake-stdout.txt)"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "Expected --fake rejection but command succeeded: python $*"
              exit 1
            fi
            if ! grep -Fq "unrecognized arguments: --fake" <<<"$stderr"; then
              echo "Expected argparse --fake error for: python $*"
              echo "$stderr"
              exit 1
            fi
          }
          check_rejects_fake scripts/run_final_v2.py --execute --fake

      - name: Validate archive snapshot
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          git archive --format=tar HEAD -o "$tmp/repo.tar"
          mkdir "$tmp/repo"
          tar -xf "$tmp/repo.tar" -C "$tmp/repo"
          cd "$tmp/repo"
          python scripts/validate_documentation.py
          python scripts/validate_corpus_v2_1.py
          python scripts/validate_final_v2.py
          python scripts/validate_project_complete.py
          python scripts/run_final_v2.py --dry-run

      - name: Check whitespace in changed range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base"...HEAD -- ':!data/**' ':!prompts/**'
